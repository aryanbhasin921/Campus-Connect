{% extends 'base.html' %}
{% block title %}Login - CampusCommute{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-dark text-white p-4 text-center rounded-top-4">
                <div class="display-6 text-warning mb-2"><i class="bi bi-car-front"></i></div>
                <h4 class="fw-bold mb-1">CampusCommute Login</h4>
                <p class="text-white-50 small mb-0">Sign in as Passenger, Driver, or Admin</p>
            </div>
            
            <div class="card-body p-4">
                <!-- 1-Click Quick Demo Login Autofill Buttons -->
                <div class="mb-4 p-3 bg-light rounded-3 border">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-secondary text-uppercase"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Autofill:</span>
                        <span class="badge bg-secondary">1-Click</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillLogin('passenger@campuscommute.edu', 'password123')">
                                <i class="bi bi-person me-1"></i> Student 1 (Rahul)
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-info w-100 text-truncate" onclick="fillLogin('riya@campuscommute.edu', 'password123')">
                                <i class="bi bi-person me-1"></i> Student 2 (Riya)
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-success w-100 text-truncate" onclick="fillLogin('driver@campuscommute.edu', 'password123')">
                                <i class="bi bi-steering-wheel me-1"></i> Driver (Arjun)
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-danger w-100 text-truncate" onclick="fillLogin('admin@campuscommute.edu', 'admin123')">
                                <i class="bi bi-shield-lock me-1"></i> Admin (Pre-decided)
                            </button>
                        </div>
                    </div>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="email">Campus Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="student@campuscommute.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center small">
                    <span class="text-muted">New student on campus?</span>
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold ms-1">Register as a Student</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
