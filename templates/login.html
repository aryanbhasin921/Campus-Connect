{% extends 'base.html' %}
{% block title %}Login - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header text-center p-4 border-0 bg-transparent">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary p-3 mb-2" style="width: 64px; height: 64px;">
                    <i class="bi bi-car-front-fill fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark">Welcome to CampusConnect</h4>
                <p class="text-muted small mb-0">Sign in to book or offer campus rides</p>
            </div>
            
            <div class="card-body px-4 pb-4 pt-1">
                <!-- 1-Click Quick Demo Login Autofill Buttons -->
                <div class="mb-4 p-3 bg-light rounded-4 border">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-semibold text-secondary text-uppercase fs-9"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick 1-Click Demo:</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillLogin('passenger@campusconnect.edu', 'password123')">
                                <i class="bi bi-person me-1"></i> Student 1
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-info w-100 text-truncate" onclick="fillLogin('riya@campusconnect.edu', 'password123')">
                                <i class="bi bi-person me-1"></i> Student 2
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-success w-100 text-truncate" onclick="fillLogin('driver@campusconnect.edu', 'password123')">
                                <i class="bi bi-steering-wheel me-1"></i> Driver
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-outline-danger w-100 text-truncate" onclick="fillLogin('admin@campusconnect.edu', 'admin123')">
                                <i class="bi bi-shield-lock me-1"></i> Admin
                            </button>
                        </div>
                    </div>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary" for="email">Campus Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="student@campusconnect.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center small mt-4 pt-2 border-top">
                    <span class="text-muted">New student on campus?</span>
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold ms-1">Register as a Student</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
