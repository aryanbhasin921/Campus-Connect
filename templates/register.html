{% extends 'base.html' %}
{% block title %}Student Registration - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header text-center p-4 border-0 bg-transparent">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary p-3 mb-2" style="width: 64px; height: 64px;">
                    <i class="bi bi-mortarboard-fill fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark">Student Registration</h4>
                <p class="text-muted small mb-0">Join CampusConnect to ride or drive</p>
            </div>
            
            <div class="card-body px-4 pb-4 pt-1">
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="first_name">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="e.g. Rahul" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="last_name">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="e.g. Sharma" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary" for="phone_number">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="e.g. 9811122233" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary" for="email">Campus Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. student@campusconnect.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required minlength="6">
                        </div>
                    </div>

                    <div class="alert alert-info small d-flex align-items-center gap-2 mb-4">
                        <i class="bi bi-info-circle-fill fs-5"></i>
                        <span>Once registered, you can find rides as a passenger or register a car to drive.</span>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-person-check-fill me-1"></i> Register as Student
                    </button>
                </form>

                <div class="text-center small mt-4 pt-2 border-top">
                    <span class="text-muted">Already registered?</span>
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold ms-1">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
